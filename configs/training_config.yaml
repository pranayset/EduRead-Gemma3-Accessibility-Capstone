# EduRead V3 — reference configuration based on the audited run.
# This file documents known settings; it is not an executable guarantee.
# Confirm paths, package compatibility, and hardware before a new run.

project:
  name: "EduRead-Gemma3-Accessibility-Capstone"
  dataset_version: "V3"
  seed: 42

model:
  model_id: "google/paligemma-3b-pt-448"
  model_class: "PaliGemmaForConditionalGeneration"
  processor_id: "google/paligemma-3b-pt-448"
  image_resolution: 448
  torch_dtype: "float16"
  attention_implementation: "eager"

quantization:
  method: "QLoRA"
  load_in_4bit: true
  quant_type: "nf4"
  double_quant: true
  compute_dtype: "float16"

lora:
  enabled: true
  method: "PEFT"
  task_type: "CAUSAL_LM"
  rank: 8
  alpha: 16
  dropout: 0.05
  target_modules:
    - "q_proj"
    - "v_proj"
  bias: "none"

dataset:
  train_manifest: "data/manifests/train.json"
  evaluation_manifest: "data/manifests/eval.json"
  training_records: 160
  evaluation_records: 40
  tasks:
    - "mathematical_transcription"
    - "accessible_explanation"
  image_size: 448
  private_data_allowed_in_repository: false

training:
  epochs: 3
  learning_rate: 0.00002
  optimizer_updates_per_epoch: 40
  total_optimizer_updates: 120
  precision: "fp16"
  seed: 42

evaluation:
  generation_max_new_tokens: 64
  greedy_decoding:
    do_sample: false
    num_beams: 1
  report:
    - "exact_match"
    - "token_accuracy"
    - "character_similarity"
    - "human_mathematical_review"
    - "accessibility_review"

artifacts:
  adapter_output: "outputs/eduread_v3_qlora/final_adapter"
  checkpoints_directory: "outputs/eduread_v3_qlora/checkpoints"
  keep_model_weights_out_of_git: true

security:
  credentials_from_environment_or_colab_secrets: true
  commit_private_datasets: false
  commit_model_weights: false
  commit_adapter_files: false
